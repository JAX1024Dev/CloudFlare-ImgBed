name: Deploy to Cloudflare Workers
on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: 'Worker Name'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate and mask deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          WORKER_VARS: ${{ secrets.WORKER_VARS }}
        run: |
          node --input-type=module <<'NODE'
          for (const key of ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'D1_DATABASE_ID', 'WORKER_VARS']) {
            if (!process.env[key]) throw new Error(key + ' is required');
          }
          const vars = JSON.parse(process.env.WORKER_VARS);
          for (const value of Object.values(vars)) {
            const masked = String(value).replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
            if (masked) console.log('::add-mask::' + masked);
          }
          for (const key of ['BASIC_USER', 'BASIC_PASS', 'AUTH_CODE']) {
            if (typeof vars[key] !== 'string' || !vars[key].trim()) throw new Error(key + ' must be configured before deployment');
          }
          NODE
      - name: Install dependencies
        run: npm ci --workspace=@cloudflare-imgbed/common --workspace=@cloudflare-imgbed/worker --omit=dev
      - name: Generate worker routes
        run: node deploy/worker/generate-routes.js
      - name: Generate wrangler config
        env:
          WORKER_NAME: ${{ inputs.worker_name || secrets.WORKER_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          WORKER_VARS: ${{ secrets.WORKER_VARS }}
        run: node deploy/worker/generate-toml.js
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config deploy/worker/wrangler.toml
